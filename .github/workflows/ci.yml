name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # errcheck (via golangci-lint) — fails the build when an error return is
      # silently discarded. Config: backend/.golangci.yml
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # ESLint — the headline rule is @typescript-eslint/no-floating-promises,
      # which fails the build on unhandled async calls. Config: eslint.config.mjs
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://thimble-backend.fly.dev
          # Dummy values: the R2 S3 client and a few routes read these at
          # module load during build-time page-data collection. They only
          # need to be non-empty here — no real R2 calls happen in a build.
          R2_ACCOUNT_ID: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_BUCKET_NAME: ci-dummy
          R2_PUBLIC_URL: https://ci-dummy.example.com

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()
    steps:
      - name: Send failure email via Resend
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "Thimble CI <no-reply@tvimble.tech>",
              "to": ["anjeesax@gmail.com"],
              "subject": "CI failed — ${{ github.ref_name }}",
              "text": "A CI job failed on Thimble.\n\nBranch:  ${{ github.ref_name }}\nCommit:  ${{ github.sha }}\nAuthor:  ${{ github.actor }}\nMessage: ${{ github.event.head_commit.message }}\n\nView the failed run:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
